name: Release - publish

# Runs itself when a release PR from "Release - prepare" lands on main: merging
# that PR is the decision to release, so requiring a second manual step only
# adds a way to forget. It tags the merged commit and publishes to npm; nothing
# here bumps versions - whatever is in the manifests is what ships.
#
# Can also be dispatched by hand, which defaults to a dry run.
#
# This is the only irreversible step in the repository - npm does not allow a
# version to be republished - so it is guarded three ways: it refuses to run
# outside main, it only tags versions that have no tag yet, and it publishes
# only when that tagging produced something new.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would be tagged and published, without doing it'
        type: boolean
        default: true

concurrency: ${{ github.workflow }}

jobs:
  publish:
    # On push, only the commit a release PR produces qualifies. Anything else
    # landing on main is an ordinary change and must not reach the registry.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    env:
      # A push means a real release; only a manual run can be a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Refuse to publish from anywhere but main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "This workflow may only run on main; got ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Astro 7 needs Node >=22.23.4; the runner's cached 22.x can be older.
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Tags carry the version history nx release reads on the next run, so they
      # have to match releaseTag.pattern in nx.json: {projectName}@{version}.
      - name: Tag the release
        id: tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          created=0
          fresh=""
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            private=$(node -p "require('./$manifest').private === true")
            [ "$private" = "true" ] && continue
            version=$(node -p "require('./$manifest').version")
            tag="$name@$version"

            # An existing tag means this exact version already shipped. That is
            # the normal case for every package a release did not touch, and it
            # is what keeps the publish step below from offering npm a version
            # it already has.
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "  $tag already exists - skipping"
              continue
            fi

            fresh="${fresh:+$fresh,}$name"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  would tag $tag"
            else
              git tag -a "$tag" -m "$tag"
              created=$((created + 1))
              echo "  tagged $tag"
            fi
          done

          if [ "$DRY_RUN" != "true" ] && [ "$created" -gt 0 ]; then
            git push origin --tags
          fi

          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "projects=$fresh" >> "$GITHUB_OUTPUT"

      # No new tag means every version in the manifests is already released, so
      # there is nothing to push and npm would reject it anyway.
      #
      # Only the freshly tagged projects are published. A release may cover one
      # package while the rest of the workspace keeps versions npm already has,
      # and offering those again fails the whole job - so the tag step's list of
      # what was actually new is what gets published.
      - name: Publish to npm
        if: ${{ github.event_name == 'workflow_dispatch' || steps.tag.outputs.created != '0' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          PROJECTS: ${{ steps.tag.outputs.projects }}
        run: |
          set -euo pipefail

          if [ -z "$PROJECTS" ]; then
            echo "Every version in the manifests is already on npm; nothing to publish."
            exit 0
          fi

          echo "Publishing: $PROJECTS"

          if [ "$DRY_RUN" = "true" ]; then
            pnpm exec nx release publish --dry-run --projects="$PROJECTS"
          else
            pnpm exec nx release publish --projects="$PROJECTS"
          fi
